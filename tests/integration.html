<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Test integrare UI — Compensatii</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; background: #f4f6f9; }
    .t { border: 1px solid #e2e8f0; background: #fff; border-left: 5px solid #15803d; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .t.fail { border-left-color: #b91c1c; background: #fdecec; }
    .summary { margin: 16px 0; padding: 12px; border-radius: 8px; font-weight: 600; background: #e7f6ec; color: #15803d; }
    .summary.fail { background: #fdecec; color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Test integrare (UI + motor)</h1>
  <div id="app"></div>
  <div id="out"></div>

  <script src="../vendor/preact.min.js"></script>
  <script src="../vendor/preact-hooks.js"></script>
  <script src="../vendor/htm.js"></script>
  <script src="../js/norma.js"></script>
  <script src="../js/rules.js"></script>
  <script src="../js/help.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/validate.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/calc.js"></script>
  <script src="../js/guide.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/ui/core.js"></script>
  <script src="../js/ui/views_basic.js"></script>
  <script src="../js/ui/views_install.js"></script>
  <script src="../js/ui/views_results.js"></script>
  <script src="../js/ui/app.js"></script>
  <script>
    var out = document.getElementById('out');
    var pass = 0, fail = 0;

    function test(name, fn) {
      var errs = [];
      try { fn(); } catch (e) { errs.push('Excepție: ' + e.message); }
      var ok = errs.length === 0;
      if (ok) pass++; else fail++;
      var d = document.createElement('div');
      d.className = 't' + (ok ? '' : ' fail');
      d.innerHTML = '<strong>' + (ok ? 'PASS' : 'FAIL') + '</strong> — ' + name +
        (ok ? '' : '<br>' + errs.join('<br>'));
      out.appendChild(d);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var ready = (window.AppUI && window.AppUI.ready) ? window.AppUI.ready() : Promise.resolve();
      ready.then(runTests, runTests);
    });

    // Proiect gol cu „tariful achitat integral” confirmat manual (art. 7 alin. 1),
    // ca testele care nu completează „Data achitare TR” să nu fie blocate de art. 8.
    function emptyOk() {
      var p = window.AppState.emptyProject();
      p.conditii.tarifAchitatIntegral = true;
      return p;
    }

    // Caută un element după selector și text conținut.
    function byText(sel, text) {
      var l = document.querySelectorAll(sel);
      for (var i = 0; i < l.length; i++) if (l[i].textContent.indexOf(text) >= 0) return l[i];
      return null;
    }
    function detailsOf(summaryText) {
      var l = document.querySelectorAll('details');
      for (var i = 0; i < l.length; i++) {
        var sm = l[i].querySelector('summary');
        if (sm && sm.textContent.indexOf(summaryText) >= 0) return l[i];
      }
      return null;
    }

    function runTests() {
      test('UI se inițializează: ecran de start fără proiect, apoi pașii', function () {
        if (!document.querySelector('.start-card')) throw new Error('ecranul de start lipsește (fără proiect salvat)');
        if (document.querySelector('.tabs')) throw new Error('pașii nu trebuie afișați fără proiect');
        window.AppUI.setProject(window.AppState.demoU4());
        if (!document.querySelector('.tabs')) throw new Error('tabs lipsă');
      });

      test('Scenariu U4 prin UI — centralizator 1.500 lei', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        var r = window.AppUI.calculate();
        if (!r || !r.central) throw new Error('fără rezultat');
        if (Math.abs(r.central.totalFaraTVA - 1500) > 0.01) throw new Error('total=' + r.central.totalFaraTVA);
        if (Math.abs(r.central.totalCuTVA - 1785) > 0.01) throw new Error('totalTVA=' + r.central.totalCuTVA);
      });

      test('Randare centralizator în DOM', function () {
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        var html = document.getElementById('app').innerHTML;
        if (html.indexOf('Centralizator') < 0) throw new Error('centralizator neafișat');
      });

      test('Verificare condiții Art. 8 (5 condiții)', function () {
        var r = window.AppUI.calculate();
        if (!r.conditions || r.conditions.length !== 5) throw new Error('condiții incorecte');
      });

      test('Cost tronson se calculează automat din lungime × b_L', function () {
        var p = emptyOk();
        p.meta.model = 'line';
        var u1 = window.AppState.addUser(p, { nume: 'U1' });
        var u2 = window.AppState.addUser(p, { nume: 'U2' });
        p.linii.push({
          id: 'L1', nume: 'Linie', IL: 6000, L: 200, bL: 0, bLManual: false,
          tronsoane: [
            { id: 'T1', nume: 'T1', lungime: 100, cost: 0, costManual: false, utilizatori: [u1.id, u2.id] },
            { id: 'T2', nume: 'T2', lungime: 50, cost: 0, costManual: false, utilizatori: [u2.id] }
          ]
        });
        p.meta.nouUtilizatoriIds = [u2.id];
        p.meta.noulUtilizatorId = u2.id;
        window.AppUI.setProject(p);
        // Simulează setarea I_L și L (b_L trebuie derivat automat = 6000/200 = 30)
        var cfg = window.AppUI.buildConfig('line');
        if (Math.abs(cfg.tronsoane[0].cost - 3000) > 0.01) throw new Error('T1 cost=' + cfg.tronsoane[0].cost);
        if (Math.abs(cfg.tronsoane[1].cost - 1500) > 0.01) throw new Error('T2 cost=' + cfg.tronsoane[1].cost);
        // U1 a finanțat T1; U2 se racordează -> U1 primește 3000 - 1500 = 1500
        var r = window.AppUI.calculate();
        if (Math.abs(r.payments[u2.id][u1.id] - 1500) > 0.01) throw new Error('compensatie=' + r.payments[u2.id][u1.id]);
      });

      test('b_L derivat automat din I_L / L', function () {
        var p = emptyOk();
        p.linii.push({ id: 'L1', nume: 'L', IL: 6000, L: 200, bL: 0, bLManual: false, tronsoane: [] });
        window.AppUI.setProject(p);
        var st = window.AppUI.getState();
        if (Math.abs(st.linii[0].bL - 30) > 0.001) throw new Error('bL=' + st.linii[0].bL);
      });

      test('Tastarea cifrelor nu le amestecă și nu re-randează inputul', function () {
        var p = emptyOk();
        p.meta.model = 'line';
        window.AppState.addUser(p, { nume: 'U1' });
        window.AppState.addUser(p, { nume: 'U2' });
        p.linii.push({ id: 'L1', nume: 'L', IL: 0, L: 0, bL: 0, bLManual: false, tronsoane: [
          { id: 'T1', nume: 'T1', lungime: 0, cost: 0, costManual: false, utilizatori: [] }
        ]});
        window.AppUI.setProject(p);
        window.AppUI.setTab('instalatie');

        var el = document.querySelector('[data-bind="line.L1.IL"]');
        var before = el;
        '6000'.split('').forEach(function (ch) {
          el.value = el.value + ch;
          el.dispatchEvent(new Event('input', { bubbles: true }));
        });
        if (el.value !== '6000') throw new Error('valoare amestecată: ' + el.value);
        if (before !== document.querySelector('[data-bind="line.L1.IL"]')) throw new Error('inputul a fost înlocuit');
        if (Number(window.AppUI.getState().linii[0].IL) !== 6000) throw new Error('model IL greșit');

        // completăm L și verificăm că b_L se afișează live
        var lEl = document.querySelector('[data-bind="line.L1.L"]');
        '200'.split('').forEach(function (ch) {
          lEl.value = lEl.value + ch;
          lEl.dispatchEvent(new Event('input', { bubbles: true }));
        });
        var bLEl = document.querySelector('[data-bind="line.L1.bL"]');
        if (Number(bLEl.value) !== 30) throw new Error('b_L live greșit: ' + bLEl.value);

        // lungime tronson -> cost afișat automat 3.000
        var lung = document.querySelector('[data-bind="tronson.L1.T1.lungime"]');
        '100'.split('').forEach(function (ch) {
          lung.value = lung.value + ch;
          lung.dispatchEvent(new Event('input', { bubbles: true }));
        });
        var span = document.querySelector('[data-derived-cost="L1-T1"]');
        if (!span || span.textContent.indexOf('3.000') < 0) throw new Error('cost live: ' + (span && span.textContent));
      });

      test('Un singur prim utilizator: alegerea rolului „prim” îl demotează pe cel anterior', function () {
        var p = emptyOk();
        var u1 = window.AppState.addUser(p, { nume: 'U1', prim: true });
        var u2 = window.AppState.addUser(p, { nume: 'U2' });
        window.AppUI.setProject(p);
        window.AppUI.store.set('user.' + u2.id + '.rol', 'prim');
        var st = window.AppUI.getState();
        var prims = st.utilizatori.filter(function (u) { return u.rol === 'prim'; });
        if (prims.length !== 1 || prims[0].id !== u2.id) throw new Error('roluri: ' + st.utilizatori.map(function (u) { return u.rol; }));
      });

      test('Anexa 2 prin UI — primul bifat primește, nu plătește', function () {
        var p = emptyOk();
        p.meta.model = 'station';
        var a = window.AppState.addUser(p, { nume: 'A', putere: 100, prim: true });
        var b = window.AppState.addUser(p, { nume: 'B', putere: 100 });
        var c = window.AppState.addUser(p, { nume: 'C', putere: 100 });
        p.statii.push({ id: 'S1', nume: 'PT', Sn: 400, IT: 100000, elementeComune: 0, utilizatori: [a.id, b.id, c.id] });
        p.meta.nouUtilizatoriIds = [c.id]; // noul utilizator plătește
        window.AppUI.setProject(p);
        var r = window.AppUI.calculate();
        if (r.error) throw new Error('nu ar trebui blocat: ' + r.error);
        // A este primul -> primește de la C 25.000 (B nu e utilizator nou)
        if (Math.abs(r.central.totalFaraTVA - 25000) > 0.01) throw new Error('C plătește ' + r.central.totalFaraTVA);
      });

      test('Doi utilizatori noi pe tronsoane diferite (prin UI)', function () {
        var p = emptyOk();
        p.meta.model = 'line';
        var u1 = window.AppState.addUser(p, { nume: 'U1', prim: true });
        var u2 = window.AppState.addUser(p, { nume: 'U2' });
        var u3 = window.AppState.addUser(p, { nume: 'U3' });
        var u4 = window.AppState.addUser(p, { nume: 'U4' });
        p.linii.push({
          id: 'L1', nume: 'Linie', IL: 6000, L: 200, bL: 0, bLManual: false,
          tronsoane: [
            { id: 'T1', nume: 'T1', lungime: 100, cost: 0, costManual: false, utilizatori: [u1.id, u2.id] },
            { id: 'T2', nume: 'T2', lungime: 50, cost: 0, costManual: false, utilizatori: [u2.id, u3.id] },
            { id: 'T3', nume: 'T3', lungime: 60, cost: 0, costManual: false, utilizatori: [u2.id, u4.id] }
          ]
        });
        p.meta.nouUtilizatoriIds = [u3.id, u4.id]; // ambii se racordează
        window.AppUI.setProject(p);
        var r = window.AppUI.calculate();
        if (r.error) throw new Error('nu ar trebui blocat: ' + r.error);
        // Ambii noi plătesc; centralizatorul are linii de la ambele.
        if (!r.payments[u3.id] || !r.payments[u4.id]) throw new Error('ambii utilizatori noi trebuie să plătească');
        if (r.central.newList.length !== 2) throw new Error('newList=' + r.central.newList.length);
      });

      test('Anexa 3 (complex) prin UI — varianta 3 = linie + stație', function () {
        var p = emptyOk();
        p.meta.model = 'complex';
        p.complexConfig.varianta = 3;
        var u1 = window.AppState.addUser(p, { nume: 'U1', putere: 0, prim: true });
        var u2 = window.AppState.addUser(p, { nume: 'U2', putere: 100 });
        var linie = { id: 'L1', nume: 'Linie', IL: 50000, L: 100, bL: 0, bLManual: false,
          tronsoane: [{ id: 'T1', nume: 'T1', lungime: 80, cost: 0, costManual: false, utilizatori: [u1.id, u2.id] }] };
        p.linii.push(linie);
        p.complexConfig.liniiIds = [linie.id];
        var st = { id: 'S1', nume: 'PT', Sn: 400, SnRezerva: 0, IT: 100000, elementeComune: 0, utilizatori: [u1.id, u2.id] };
        p.statii.push(st);
        p.complexConfig.statiiIds = [st.id];
        p.meta.nouUtilizatoriIds = [u2.id];
        window.AppUI.setProject(p);
        var r = window.AppUI.calculate();
        if (r.error) throw new Error('nu ar trebui blocat: ' + r.error);
        // linie 20000 + stație 100*250=25000 => 45000
        if (Math.abs(r.payments[u2.id][u1.id] - 45000) > 0.01) throw new Error('U2->U1=' + r.payments[u2.id][u1.id]);
      });

      test('Import: id-uri și câmpuri periculoase sunt sanitizate (fără XSS)', function () {
        window.__xss = 0;
        var evil = {
          meta: { operator: '<img src=x onerror="window.__xss=1">', model: 'line', nouUtilizatoriIds: ['b"><img src=x onerror="window.__xss=2">'] },
          utilizatori: [
            { id: 'a"><img src=x onerror="window.__xss=3">', nume: 'A', prim: true },
            { id: 'b"><img src=x onerror="window.__xss=2">', nume: 'B' }
          ],
          linii: [{ id: 'l"><i>', nume: 'L', IL: 100, L: 10, tronsoane: [
            { id: 't"><i>', nume: 'T', lungime: 10, utilizatori: ['a"><img src=x onerror="window.__xss=3">', 'b"><img src=x onerror="window.__xss=2">'] }
          ] }]
        };
        var p = window.AppState.migrate(evil);
        if (/[^A-Za-z0-9_-]/.test(p.utilizatori[0].id)) throw new Error('id nesanitizat: ' + p.utilizatori[0].id);
        if (p.linii[0].tronsoane[0].utilizatori.length !== 2) throw new Error('referințele nu au fost remapate');
        if (p.utilizatori[1].rol !== 'nou' || p.utilizatori[0].rol !== 'prim') throw new Error('rolurile nu au fost migrate: ' + p.utilizatori.map(function (u) { return u.rol; }));
        window.AppUI.setProject(p);
        window.AppUI.setTab('utilizatori'); window.AppUI.setTab('instalatie');
        window.AppUI.setTab('rezultate'); window.AppUI.calculate();
        if (window.__xss) throw new Error('cod executat din date importate: ' + window.__xss);
        if (document.getElementById('app').innerHTML.indexOf('<img src=x') >= 0) throw new Error('HTML injectat în pagină');
      });

      test('Import: structuri nevalide sunt respinse / normalizate', function () {
        ['null', '[]', '"text"', '5'].forEach(function (raw) {
          var threw = false;
          try { window.AppState.migrate(JSON.parse(raw)); } catch (e) { threw = true; }
          if (!threw) throw new Error('ar fi trebuit respins: ' + raw);
        });
        var p = window.AppState.migrate({ linii: [{ id: 'x' }], statii: 'nu-lista', meta: { model: 'inexistent' } });
        if (p.linii[0].tronsoane.length !== 0) throw new Error('tronsoane lipsă nenormalizate');
        if (p.meta.model !== 'line') throw new Error('model necunoscut nenormalizat');
        if (!Array.isArray(p.statii)) throw new Error('statii nenormalizat');
      });

      test('Migrare: câmpul vechi „noul utilizator” devine listă', function () {
        var p = window.AppState.migrate({
          utilizatori: [{ id: 'u1', prim: true }, { id: 'u2' }],
          meta: { noulUtilizatorId: 'u2' }
        });
        if (p.utilizatori[1].rol !== 'nou' || p.utilizatori[0].rol !== 'prim') throw new Error('migrare: ' + p.utilizatori.map(function (u) { return u.rol; }));
        if (p.meta.nouUtilizatoriIds !== undefined) throw new Error('câmpul vechi trebuia eliminat');
      });

      test('Rezultatele se actualizează automat la modificarea datelor', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        window.AppUI.setTab('rezultate');
        var r = window.AppUI.calculate();
        if (Math.abs(r.central.totalFaraTVA - 1500) > 0.01) throw new Error('total inițial ' + r.central.totalFaraTVA);
        window.AppUI.setTab('instalatie');
        var el = document.querySelector('[data-bind^="tronson."][data-bind$=".lungime"]');
        el.value = '50'; el.dispatchEvent(new Event('input', { bubbles: true }));
        window.AppUI.setTab('rezultate');
        var txt = document.querySelector('tfoot').textContent;
        if (txt.indexOf('1.500,00') >= 0) throw new Error('rezultat vechi rămas afișat: ' + txt);
      });

      test('Validare: date imposibile blochează calculul', function () {
        function build(mut) {
          var p = window.AppState.demoU4();
          mut(p);
          window.AppUI.setProject(p);
          return window.AppUI.calculate();
        }
        var r = build(function (p) { p.utilizatori[1].putere = -5; });
        if (!r.error) throw new Error('putere negativă acceptată');
        r = build(function (p) { p.meta.model = 'station'; p.statii.push({ id: 'S', nume: 'S', Sn: 100, SnRezerva: 200, IT: 1000, elementeComune: 0, utilizatori: [] }); });
        if (!r.error) throw new Error('rezervă > S_n acceptată');
        r = build(function (p) { p.meta.model = 'developer'; p.dezvoltator = { Itotal: 100, Ief: 150, dezvoltatori: [{ id: 'd', nume: 'd', putere: 1 }] }; });
        if (!r.error) throw new Error('I_ef > I_total acceptat');
        r = build(function (p) { p.meta.model = 'transitional'; p.tranzitoriu = { B: 1000, S: 100, S2: 10, l2: 500, L: 100 }; });
        if (!r.error) throw new Error('l_2 > L acceptat');
        r = build(function (p) { p.meta.tva = 150; });
        if (!r.error) throw new Error('TVA 150% acceptat');
      });

      test('Avertisment: utilizator nou neasignat pe niciun tronson', function () {
        var p = window.AppState.demoU4();
        p.linii[0].tronsoane.forEach(function (t) { t.utilizatori = t.utilizatori.slice(0, 2); });
        window.AppUI.setProject(p);
        var v = window.AppUI.validate();
        if (!v.warnings.some(function (w) { return w.text.indexOf('niciun tronson') >= 0; })) throw new Error('fără avertisment: ' + JSON.stringify(v));
      });

      test('Detaliu stație afișează valorile reale (nu 0)', function () {
        var p = emptyOk();
        p.meta.model = 'station';
        var a = window.AppState.addUser(p, { nume: 'A', putere: 100, prim: true });
        var c = window.AppState.addUser(p, { nume: 'C', putere: 50 });
        p.statii.push({ id: 'S1', nume: 'PT', Sn: 400, SnRezerva: 0, IT: 100000, elementeComune: 0, utilizatori: [a.id, c.id] });
        p.meta.nouUtilizatoriIds = [c.id];
        window.AppUI.setProject(p);
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        var txt = detailsOf('Detaliu stații').textContent;
        if (txt.indexOf('250,00') < 0) throw new Error('b_T lipsă din detaliu: ' + txt);
      });

      test('Operatorul din date apare escapat în rezultate/print', function () {
        var p = window.AppState.demoU4();
        p.meta.operator = '<b id="inj">Op</b>';
        window.AppUI.setProject(p);
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        if (document.getElementById('inj')) throw new Error('operator neescapat');
        if (document.querySelector('.print-head').textContent.indexOf('<b id="inj">') < 0) throw new Error('antetul nu conține operatorul');
      });

      test('Focusul rămâne pe câmp după modificare (fără re-randare totală)', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        window.AppUI.setTab('date');
        var el = document.querySelector('[data-bind="meta.operator"]');
        el.focus();
        el.value = 'Alt operator';
        el.dispatchEvent(new Event('change', { bubbles: true }));
        if (document.activeElement !== el) throw new Error('focus pierdut / element înlocuit');
        if (window.AppUI.getState().meta.operator !== 'Alt operator') throw new Error('modelul nu s-a actualizat');
        // checkbox: se re-randează, dar focusul trebuie refăcut pe același control
        var cb = document.querySelector('[data-bind="meta.withTva"]');
        cb.focus(); cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change', { bubbles: true }));
        if (!document.activeElement || document.activeElement.getAttribute('data-bind') !== 'meta.withTva') throw new Error('focus nerefăcut după re-randare');
      });

      test('Undo: ștergerea unui tronson poate fi anulată', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        window.AppUI.setTab('instalatie');
        var st = window.AppUI.getState();
        var before = st.linii[0].tronsoane.length;
        window.AppUI.store.delTronson(st.linii[0].id, st.linii[0].tronsoane[0].id);
        if (window.AppUI.getState().linii[0].tronsoane.length !== before - 1) throw new Error('ștergerea nu a funcționat');
        if (window.AppUI.undoDepth() < 1) throw new Error('undo indisponibil');
        window.AppUI.undo();
        if (window.AppUI.getState().linii[0].tronsoane.length !== before) throw new Error('undo nu a restaurat');
      });

      test('Export CSV: 2 zecimale, virgulă, coloane aliniate', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        var csv = window.AppUI.csv();
        var lines = csv.replace('\ufeff', '').split('\r\n');
        var cols = lines[0].split(';').length;
        lines.forEach(function (l) { if (l.split(';').length !== cols) throw new Error('coloane inegale: ' + l); });
        if (lines[lines.length - 1] !== 'Total;;1500,00;1785,00') throw new Error('rând total: ' + lines[lines.length - 1]);
      });

      test('Art. 8: condiție neîndeplinită blochează calculul (cumulativ)', function () {
        var p = window.AppState.demoU4();
        p.conditii.capacitateDisponibila = false;
        window.AppUI.setProject(p);
        var r = window.AppUI.calculate();
        if (!r.error || !r.blocked) throw new Error('calculul trebuia blocat');
        if (!/art\. 8/i.test(r.error)) throw new Error('mesaj fără referință la art. 8: ' + r.error);
      });

      test('Art. 8: „Calculează oricum (informativ)” permite calculul', function () {
        var p = window.AppState.demoU4();
        p.conditii.capacitateDisponibila = false;

        if (!sk.done) throw new Error('pasul sărit trebuie considerat rezolvat');
        var m = steps.filter(function (s) { return s.id === 'model'; })[0];
        if (!m.confirm || m.confirm.path !== 'meta.modelConfirmat') throw new Error('confirmarea modelului lipsește');
      });

      test('Ghid: „Proiect nou” pornește ghidul, evidențiază câmpul și mută focusul', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        var K = window.AppUI.store;
        var origConfirm = window.confirm;
        window.confirm = function () { return true; };
        try { K.newProject(); } finally { window.confirm = origConfirm; }
        if (!K.guide.on || !K.guide.auto) throw new Error('ghidul nu e pornit în modul automat');
        var bar = document.querySelector('.guidebar');
        if (!bar || bar.textContent.indexOf('Pasul 1') < 0) throw new Error('bara de ghid lipsește: ' + (bar && bar.textContent));
        var el = document.querySelector('[data-guide-active]');
        if (!el || el.getAttribute('data-bind') !== 'meta.model') throw new Error('câmpul indicat nu e evidențiat');
        if (document.activeElement !== el) throw new Error('focusul nu a fost mutat pe câmpul indicat');
      });

      test('Ghid: după completarea unui câmp, avansează singur la pasul următor (cu schimbare de tab)', function () {
        var K = window.AppUI.store;
        K.confirmStep(K.guideNext().step);                       // model confirmat → operator
        var n = K.guideNext();
        if (n.step.id !== 'operator') throw new Error('după model: ' + n.step.id);
        K.set('meta.operator', 'OD Test');
        K.commit();                                              // câmp completat → pasul următor
        n = K.guideNext();
        if (n.step.id !== 'user-add-1') throw new Error('după operator: ' + n.step.id);
        if (K.tab !== 'utilizatori') throw new Error('tabul nu s-a schimbat: ' + K.tab);
        var active = document.querySelector('[data-guide-active]');
        if (!active || active.getAttribute('data-guide') !== 'btn:add-user') throw new Error('butonul „Adaugă utilizator” nu e evidențiat');
        active.click();                                          // primul utilizator → urmează „Adaugă utilizatorul nou”
        n = K.guideNext();
        if (n.step.id !== 'user-add-2') throw new Error('după primul utilizator: ' + n.step.id);
        document.querySelector('[data-guide="btn:add-user"]').click();   // al doilea → pasul „nume” primește focusul
        n = K.guideNext();
        if (n.step.id.indexOf('user-nume') !== 0) throw new Error('după adăugare: ' + n.step.id);
        if (document.activeElement.getAttribute('data-bind') !== n.step.target) throw new Error('focus pe ' + document.activeElement.getAttribute('data-bind'));
      });

      test('Ghid: nu mută focusul dacă utilizatorul și-a ales deja alt câmp; modul manual nu mută focusul', function () {
        var K = window.AppUI.store;
        K.setAuto(false);
        var before = document.activeElement;
        K.set('meta.operator', 'OD Alt');
        K.commit();
        if (document.activeElement !== before && document.activeElement.getAttribute('data-guide-active')) throw new Error('focus mutat în modul manual');
        var bar = document.querySelector('.guidebar');
        if (!bar) throw new Error('bara de ghid dispărută');
      });

      test('Ghid: ghidul poate fi ascuns/pornit; demo-urile nu au ghid', function () {
        var K = window.AppUI.store;
        K.setGuide(false);
        if (!document.querySelector('.guidebar.mini')) throw new Error('butonul „Pornește ghidul” lipsește');
        K.setGuide(true);
        if (!document.querySelector('.guidebar:not(.mini)')) throw new Error('ghidul nu a revenit');
        window.AppUI.setProject(window.AppState.demoU4());
        if (document.querySelector('.guidebar')) throw new Error('un exemplu nu trebuie să aibă ghid');
        if (!document.querySelector('.demo-banner')) throw new Error('bannerul „Exemplu” lipsește');
        window.AppUI.store.keepAsOwn();
        if (document.querySelector('.demo-banner')) throw new Error('bannerul trebuia să dispară');
      });

      test('Ghid: parcurs complet pe un proiect nou ajunge la „toate datele completate” și la rezultat', function () {
        var K = window.AppUI.store;
        var origConfirm = window.confirm;
        window.confirm = function () { return true; };
        try { window.AppUI.setProject(window.AppState.emptyProject()); K.newProject(); } finally { window.confirm = origConfirm; }
        var guard = 0;
        while (guard++ < 60) {
          var n = K.guideNext();
          if (!n) break;
          var s = n.step, id = s.id, st = window.AppUI.getState();
          if (s.confirm) { K.confirmStep(s); continue; }
          if (id === 'operator') { K.set('meta.operator', 'OD'); K.commit(); continue; }
          if (id === 'user-add-1' || id === 'user-add-2') { K.addUser(); continue; }
          if (id.indexOf('user-nume:') === 0) { K.set('user.' + id.split(':')[1] + '.nume', 'U' + guard); K.commit(); continue; }
          if (id.indexOf('tr-date:') === 0) { K.set('user.' + id.split(':')[1] + '.dataTR', '2024-01-01'); K.commit(); continue; }
          if (id === 'line-add') { K.addLine(); continue; }
          if (id.indexOf('line-IL:') === 0) { K.set('line.' + id.split(':')[1] + '.IL', 6000); K.commit(); continue; }
          if (id.indexOf('line-L:') === 0) { K.set('line.' + id.split(':')[1] + '.L', 200); K.commit(); continue; }
          if (id.indexOf('line-trs:') === 0) { K.addTronson(id.split(':')[1]); continue; }
          if (id.indexOf('trs-lungime:') === 0) { var q = id.split(':'); K.set('tronson.' + q[1] + '.' + q[2] + '.lungime', 100); K.commit(); continue; }
          if (id.indexOf('trs-alloc:') === 0) { var q2 = id.split(':'); K.setTronsonAllUsers(q2[1], q2[2], true); continue; }
          if (id.indexOf('nou-alloc:') === 0) { var q3 = id.split(':'); K.toggleTronsonUser(q3[1], st.linii[0].tronsoane[0].id, q3[2]); continue; }
          if (id === 'calc') { K.calculate(); K.commit(); continue; }
          throw new Error('pas neprevăzut în scenariu: ' + id + ' (' + s.label + ')');
        }
        if (guard >= 60) throw new Error('ghidul nu converge');
        var r = K.results;
        if (!r || r.error) throw new Error('rezultat: ' + (r && r.error));
        if (!document.querySelector('.guidebar.done')) throw new Error('bara „toate datele completate” lipsește');
        if (!(r.central.totalFaraTVA > 0)) throw new Error('total ' + r.central.totalFaraTVA);
      });

      test('Rezultate: explicația „Cum s-a calculat” are formulă și referință', function () {
        window.AppUI.setProject(window.AppState.demoU4());
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        var how = document.querySelector('details.how');
        if (!how) throw new Error('explicația lipsește');
        var t = how.textContent;
        if (t.indexOf('3.000,00 / 3 − 3.000,00 / 4') < 0) throw new Error('formula: ' + t);
        if (!how.querySelector('.ref[data-ref="art12.1"]')) throw new Error('referința art. 12 alin. 1 lipsește');
      });

      test('Rezultate: stări fără duplicare (o singură listă de erori) și link „Mergi la câmp”', function () {
        window.AppUI.setProject(window.AppState.emptyProject());
        window.AppUI.setTab('rezultate');
        window.AppUI.calculate();
        var cards = document.querySelectorAll('.err-card');
        if (cards.length !== 1) throw new Error('liste de erori: ' + cards.length);
        if (document.getElementById('results-region').textContent.indexOf('Nu se poate calcula') >= 0) throw new Error('mesaj duplicat „Nu se poate calcula”');
        var go = cards[0].querySelector('.go');
        if (!go) throw new Error('linkul „Mergi la câmp” lipsește');
        go.click();
        if (window.AppUI.store.tab === 'rezultate') throw new Error('linkul nu a schimbat pasul');
      });

      test('TVA: implicit 21% în proiect nou; 19% sau valoare manuală prin selector', function () {
        var p = window.AppState.emptyProject();
        if (p.meta.tva !== 21) throw new Error('implicit ' + p.meta.tva);
        window.AppUI.setProject(p);
        window.AppUI.setTab('date');
        var sel = document.querySelector('select[data-bind="meta.tvaOpt"]');
        if (!sel) throw new Error('selectorul de TVA lipsește');
        var vals = Array.prototype.map.call(sel.options, function (o) { return o.value; }).join();
        if (vals !== '21,19,alta') throw new Error('opțiuni: ' + vals);
        if (sel.value !== '21') throw new Error('selecția implicită: ' + sel.value);
        if (document.querySelector('.tva-manual')) throw new Error('câmpul manual nu trebuie vizibil la 21%');
        sel.value = '19'; sel.dispatchEvent(new Event('change', { bubbles: true }));
        if (window.AppUI.getState().meta.tva !== 19) throw new Error('19% neaplicat');
        sel = document.querySelector('select[data-bind="meta.tvaOpt"]');
        sel.value = 'alta'; sel.dispatchEvent(new Event('change', { bubbles: true }));
        var man = document.querySelector('.tva-manual input');
        if (!man) throw new Error('câmpul manual lipsește la „Altă valoare”');
        man.value = '9'; man.dispatchEvent(new Event('input', { bubbles: true }));
        if (window.AppUI.getState().meta.tva !== 9) throw new Error('manual: ' + window.AppUI.getState().meta.tva);
        if (document.querySelector('select[data-bind="meta.tvaOpt"]').value !== 'alta') throw new Error('selecția trebuie să rămână „Altă valoare”');
        // „Altă valoare” cu 21 introdus manual rămâne pe „alta”
        man = document.querySelector('.tva-manual input');
        man.value = '21'; man.dispatchEvent(new Event('input', { bubbles: true }));
        if (document.querySelector('select[data-bind="meta.tvaOpt"]').value !== 'alta') throw new Error('trebuie să rămână „alta” și la 21 manual');
      });

      test('TVA: o valoare veche (ex. 5%) se afișează ca „Altă valoare”; centralizatorul folosește cota aleasă', function () {
        var p = window.AppState.demoU4();
        p.meta.tva = 5;
        window.AppUI.setProject(p);
        window.AppUI.setTab('date');
        if (document.querySelector('select[data-bind="meta.tvaOpt"]').value !== 'alta') throw new Error('5% trebuie să apară ca „alta”');
        var r = window.AppUI.calculate();
        if (Math.abs(r.central.totalCuTVA - 1575) > 0.01) throw new Error('1500 + 5% = 1575, obținut ' + r.central.totalCuTVA);
        var q = window.AppState.demoU4(); q.meta.tva = 21;
        window.AppUI.setProject(q);
        if (Math.abs(window.AppUI.calculate().central.totalCuTVA - 1815) > 0.01) throw new Error('1500 + 21% = 1815');
      });

      var s = document.createElement('div');
      s.className = 'summary' + (fail === 0 ? '' : ' fail');
      s.textContent = 'Rezultat: ' + pass + ' trecute, ' + fail + ' eșuate.';
      document.body.insertBefore(s, out);
    }
  </script>
