<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Teste motor de calcul — Compensatii</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #1f2937; }
    h1 { font-size: 18px; }
    .t { border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .pass { border-left: 5px solid #15803d; }
    .fail { border-left: 5px solid #b91c1c; background: #fdecec; }
    .summary { margin: 16px 0; padding: 12px; border-radius: 8px; font-weight: 600; }
    .summary.pass { background: #e7f6ec; color: #15803d; }
    .summary.fail { background: #fdecec; color: #b91c1c; }
    code { background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }
    .muted { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Teste motor de calcul (Anexa 1–5)</h1>
  <p class="muted">Teste derivate din exemplele numerice ale metodologiei și din modelul .xlsx.</p>
  <div id="out"></div>

  <script src="../js/engine.js"></script>
  <script>
    var E = window.CompEngine;
    var out = document.getElementById('out');
    var pass = 0, fail = 0;

    function approx(a, b, eps) { return Math.abs(a - b) <= (eps || 0.02); }

    function test(name, fn) {
      var errs = [];
      try { fn(function (msg) { errs.push(msg); }); }
      catch (e) { errs.push('Excepție: ' + e.message); }
      var ok = errs.length === 0;
      if (ok) pass++; else fail++;
      var div = document.createElement('div');
      div.className = 't ' + (ok ? 'pass' : 'fail');
      div.innerHTML = '<strong>' + (ok ? 'PASS' : 'FAIL') + '</strong> — ' + name +
        (ok ? '' : '<br><span class="muted">' + errs.join('<br>') + '</span>');
      out.appendChild(div);
    }

    function eq(assert, actual, expected, label) {
      if (!approx(actual, expected)) assert(label + ': așteptat ' + expected + ', obținut ' + actual);
    }

    // Anexa 1, exemplul (2): al doilea utilizator la 80 m -> primul primește 20.000 lei
    test('Anexa 1 — 2 utilizatori (linie 50.000 lei / 100 m)', function (assert) {
      var res = E.computeLine({
        bL: 500, nouUtilizatori: ['U1'],
        tronsoane: [
          { id: 'T1', nume: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] },
          { id: 'T2', nume: 'T2', lungime: 20, cost: 10000, utilizatori: ['U2'] }
        ]
      });
      eq(assert, res.payments['U1']['U2'], 20000, 'U1 -> U2');
      eq(assert, res.finalShare['U1'], 20000, 'cota U1');
      eq(assert, res.finalShare['U2'], 30000, 'cota U2');
    });

    // Anexa 1, exemplul (3): al treilea utilizator -> 6.667 + 11.667 = 18.333 total
    test('Anexa 1 — 3 utilizatori (prelungire 50 m)', function (assert) {
      var res = E.computeLine({
        bL: 300, nouUtilizatori: ['U3'],
        tronsoane: [
          { id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2', 'U3'] },
          { id: 'T2', lungime: 20, cost: 10000, utilizatori: ['U2', 'U3'] },
          { id: 'T3', lungime: 50, cost: 15000, utilizatori: ['U3'] }
        ]
      });
      eq(assert, res.payments['U3']['U1'], 6666.67, 'U3 -> U1');
      eq(assert, res.payments['U3']['U2'], 11666.67, 'U3 -> U2');
      eq(assert, res.finalShare['U1'], 13333.33, 'cota U1');
      eq(assert, res.finalShare['U2'], 18333.33, 'cota U2');
      eq(assert, res.finalShare['U3'], 33333.33, 'cota U3');
    });

    // Model .xlsx U4: 2 tronsoane a 3000 lei, utilizatori U1..U4 -> 500 fiecare
    test('Model xlsx U4 — 4 utilizatori, 2 tronsoane a 3.000 lei', function (assert) {
      var t = function (n) { return { id: 'T' + n, lungime: 100, cost: 3000, utilizatori: ['U1', 'U2', 'U3', 'U4'] }; };
      var res = E.computeLine({ bL: 30, nouUtilizatori: ['U4'], tronsoane: [t(1), t(2)] });
      var c = E.centralizator(res.payments, 'U4', [
        { id: 'U1', nume: 'U1', codPA: '1' }, { id: 'U2', nume: 'U2', codPA: '2' },
        { id: 'U3', nume: 'U3', codPA: '3' }, { id: 'U4', nume: 'U4', codPA: '4' }
      ], 19, true);
      eq(assert, res.payments['U4']['U1'], 500, 'U4 -> U1');
      eq(assert, res.payments['U4']['U2'], 500, 'U4 -> U2');
      eq(assert, res.payments['U4']['U3'], 500, 'U4 -> U3');
      eq(assert, c.totalFaraTVA, 1500, 'total fara TVA');
      eq(assert, c.totalCuTVA, 1785, 'total cu TVA 19%');
    });

    // Anexa 2: b_T = 250 lei/kVA, C2 = 100 * 250 = 25.000 lei
    test('Anexa 2 — post de transformare (250 lei/kVA)', function (assert) {
      var res = E.computeStation({
        Sn: 400, IT: 100000, utilizatori: ['P', 'U2'], nouUtilizatori: ['U2'], puteri: { P: 260, U2: 100 }
      });
      eq(assert, res.bT, 250, 'b_T');
      eq(assert, res.payments['U2']['P'], 25000, 'compensatie U2 -> P');
    });

    // Anexa 2: primul utilizator (primId) este receptorul, nu `users[0]`
    test('Anexa 2 — primId bifat este receptorul (nu ordinea din listă)', function (assert) {
      var res = E.computeStation({
        Sn: 400, IT: 100000,
        utilizatori: ['A', 'B', 'C'], primId: 'B', nouUtilizatori: ['A', 'C'],
        puteri: { A: 100, B: 100, C: 100 }
      });
      // B este primul utilizator -> A și C îi plătesc; B nu plătește nimănui.
      eq(assert, res.payments['A']['B'], 25000, 'A -> B');
      eq(assert, res.payments['C']['B'], 25000, 'C -> B');
      if (res.payments['B']) assert('B nu ar trebui să plătească nimănui');
      if ((res.payments['A'] || {})['A']) assert('A nu se poate plăti pe sine');
    });

    // Doi utilizatori noi simultan (pe tronsoane diferite): plățile se cumulează
    test('Anexa 1 — doi utilizatori noi pe tronsoane diferite', function (assert) {
      var res = E.computeLine({
        bL: 300, nouUtilizatori: ['U3', 'U4'],
        tronsoane: [
          { id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] },
          { id: 'T2', lungime: 20, cost: 10000, utilizatori: ['U2', 'U3'] },
          { id: 'T3', lungime: 40, cost: 12000, utilizatori: ['U2', 'U4'] }
        ]
      });
      eq(assert, res.payments['U3']['U2'], 5000, 'U3 -> U2');
      eq(assert, res.payments['U4']['U2'], 6000, 'U4 -> U2');
    });

    // Art. 12 alin. 1 + Anexa 1: racordare secvențială. 4 utilizatori pe un tronson de 12.000 lei,
    // N1 și N2 noi (în ordine). Cei vechi primesc 12000/2 − 12000/4 = 3000 fiecare în total;
    // N2 plătește și lui N1 (racordat înaintea lui).
    test('Anexa 1 — doi utilizatori noi pe ACELAȘI tronson (secvențial)', function (assert) {
      var res = E.computeLine({
        nouUtilizatori: ['N1', 'N2'],
        tronsoane: [{ id: 'T', cost: 12000, utilizatori: ['U1', 'U2', 'N1', 'N2'] }]
      });
      var p = res.payments;
      eq(assert, p['N1']['U1'], 2000, 'N1 -> U1');
      eq(assert, p['N1']['U2'], 2000, 'N1 -> U2');
      eq(assert, p['N2']['U1'], 1000, 'N2 -> U1');
      eq(assert, p['N2']['U2'], 1000, 'N2 -> U2');
      eq(assert, p['N2']['N1'], 1000, 'N2 -> N1');
      eq(assert, p['N1']['U1'] + p['N2']['U1'], 3000, 'total primit de U1');
    });

    test('Anexa 1 — rezultatul unui utilizator nou unic nu s-a schimbat', function (assert) {
      var res = E.computeLine({ nouUtilizatori: ['U4'],
        tronsoane: [{ id: 'T', cost: 3000, utilizatori: ['U1', 'U2', 'U3', 'U4'] }] });
      eq(assert, res.payments['U4']['U1'], 250, 'U4 -> U1');
    });

    test('Anexa 2 — S_n exclude transformatorul de rezervă N-1', function (assert) {
      var res = E.computeStation({
        Sn: 1000, SnRezerva: 400, IT: 300000,
        utilizatori: ['P', 'U2'], primId: 'P', nouUtilizatori: ['U2'],
        puteri: { P: 0, U2: 100 }
      });
      eq(assert, res.SnEfectiv, 600, 'S_n efectiv');
      eq(assert, res.bT, 500, 'b_T = 300000/600');
      eq(assert, res.payments['U2']['P'], 50000, 'U2 plătește 100*500');
    });

    // Anexa 3: variantele de racordare însumează componentele corecte
    test('Anexa 3 — varianta 2: linie U1 + echipamente comune (nu stație)', function (assert) {
      var res = E.computeComplex({
        varianta: 2,
        liniiU1: [{ bL: 500, tronsoane: [{ id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] }] }],
        statii: [{ Sn: 400, IT: 100000, elementeComune: 12000, utilizatori: ['U1', 'U2'], primId: 'U1' }],
        echipamenteComune: 12000,
        primId: 'U1',
        nouUtilizatori: ['U2']
      });
      // linie: U2 -> U1 = 20000; echipamente: 12000/2=6000 după, 12000/1=12000 înainte -> 6000
      eq(assert, res.payments['U2']['U1'], 26000, 'U2 -> U1 (linie + echipamente)');
      eq(assert, res.varianta, 2, 'varianta');
    });

    test('Anexa 3 — varianta 2: echipamentele comune se plătesc TUTUROR utilizatorilor existenți', function (assert) {
      var res = E.computeComplex({
        varianta: 2,
        liniiU1: [],
        statii: [{ Sn: 400, IT: 100000, elementeComune: 12000, utilizatori: ['U1', 'U2', 'U3'], primId: 'U1' }],
        primId: 'U1', nouUtilizatori: ['U3']
      });
      // 12000/2 − 12000/3 = 2000 către fiecare dintre U1 și U2
      eq(assert, res.payments['U3']['U1'], 2000, 'U3 -> U1');
      eq(assert, res.payments['U3']['U2'], 2000, 'U3 -> U2');
    });

    test('Anexa 3 — varianta 3: echipamentele comune NU se adaugă (Anexa 3 literal)', function (assert) {
      var res = E.computeComplex({
        varianta: 3,
        liniiU1: [{ bL: 500, tronsoane: [{ id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] }] }],
        statii: [{ Sn: 400, IT: 100000, elementeComune: 12000, utilizatori: ['U1', 'U2'], primId: 'U1' }],
        puteri: { U1: 0, U2: 100 }, primId: 'U1', nouUtilizatori: ['U2']
      });
      eq(assert, res.payments['U2']['U1'], 45000, 'U2 -> U1 (fără echipamente comune)');
    });

    test('Anexa 3 — varianta 3: linie U1 + stație (Anexa 2)', function (assert) {
      var res = E.computeComplex({
        varianta: 3,
        liniiU1: [{ bL: 500, tronsoane: [{ id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] }] }],
        statii: [{ Sn: 400, IT: 100000, utilizatori: ['U1', 'U2'], primId: 'U1' }],
        puteri: { U1: 0, U2: 100 },
        primId: 'U1',
        nouUtilizatori: ['U2']
      });
      // linie 20000 + stație 100*250 = 25000 => 45000
      eq(assert, res.payments['U2']['U1'], 45000, 'U2 -> U1 (linie + stație)');
    });

    test('Anexa 3 — varianta 4: linie U1 + stație + linie U2', function (assert) {
      var res = E.computeComplex({
        varianta: 4,
        liniiU1: [{ bL: 500, tronsoane: [{ id: 'T1', lungime: 80, cost: 40000, utilizatori: ['U1', 'U2'] }] }],
        liniiU2: [{ bL: 200, tronsoane: [{ id: 'T2', lungime: 50, cost: 10000, utilizatori: ['U2'] }] }],
        statii: [{ Sn: 400, IT: 100000, utilizatori: ['U1', 'U2'], primId: 'U1' }],
        puteri: { U1: 0, U2: 100 },
        primId: 'U1',
        nouUtilizatori: ['U2']
      });
      // 20000 (linie U1) + 25000 (stație) + 10000 (linie U2, plătită către primul din U2? de fapt către U1)
      if (!(res.payments['U2']['U1'] >= 45000)) assert('U2 -> U1 >= 45000, got ' + res.payments['U2']['U1']);
    });

    // Anexa 4: C2 = 30 * 500 * (90/100) = 13.500 lei
    test('Anexa 4 — prevederi tranzitorii', function (assert) {
      var res = E.computeTransitional({ B: 50000, S: 100, S2: 30, l2: 90, L: 100 });
      eq(assert, res.b, 500, 'b');
      eq(assert, res.C2, 13500, 'C2');
    });

    // Anexa 5: X_ef = 87,5%; cote 9,375% / 3,125%; sume 14.062,5 / 4.687,5
    test('Anexa 5 — cote de eficiență/ineficiență', function (assert) {
      var res = E.computeDeveloper({
        Itotal: 150000, Ief: 131250,
        dezvoltatori: [ { id: 'D1', nume: 'D1', putere: 300 }, { id: 'D2', nume: 'D2', putere: 100 } ]
      });
      eq(assert, res.Xef, 0.875, 'X_ef');
      eq(assert, res.rows[0].Xinef, 0.09375, 'X_D1');
      eq(assert, res.rows[1].Xinef, 0.03125, 'X_D2');
      eq(assert, res.rows[0].suma, 14062.5, 'suma D1');
      eq(assert, res.rows[1].suma, 4687.5, 'suma D2');
    });

    // --- regresii după raportul de verificare ---
    test('Rotunjire r2 — valori la limită (1,005 / 2,675 / 1234,565)', function (assert) {
      eq(assert, E.r2(1.005), 1.01, '1.005');
      eq(assert, E.r2(2.675), 2.68, '2.675');
      eq(assert, E.r2(1234.565), 1234.57, '1234.565');
      eq(assert, E.r2(-2.675), -2.68, '-2.675');
    });

    test('Plățile negative nu sunt transformate în plăți pozitive', function (assert) {
      var res = E.computeStation({ Sn: 400, IT: 100000, utilizatori: ['A', 'B'], primId: 'A',
        nouUtilizatori: ['B'], puteri: { A: 100, B: -50 } });
      if (res.payments['B'] && res.payments['B']['A']) assert('putere negativă a produs plată: ' + res.payments['B']['A']);
    });

    test('Anexa 2 — primul utilizator primește chiar dacă nu e în lista stației', function (assert) {
      var res = E.computeStation({ Sn: 400, IT: 100000, utilizatori: ['X', 'N'], primId: 'P',
        nouUtilizatori: ['N'], puteri: { X: 100, N: 50, P: 100 } });
      if (!res.payments['N'] || !res.payments['N']['P']) assert('plata trebuie să meargă la P');
      if (res.payments['N'] && res.payments['N']['X']) assert('plata nu trebuie să meargă la X');
      eq(assert, res.payments['N']['P'], 12500, 'N -> P');
    });

    test('Anexa 2 — mai multe stații se însumează (cfg.statii)', function (assert) {
      var res = E.compute('station', { nouUtilizatori: ['N'], primId: 'P', puteri: { P: 100, N: 100 },
        statii: [
          { Sn: 400, IT: 100000, utilizatori: ['P', 'N'] },
          { Sn: 200, IT: 20000, utilizatori: ['P', 'N'] }
        ] });
      eq(assert, res.payments['N']['P'], 25000 + 10000, 'N -> P');
      eq(assert, res.statii.length, 2, 'nr. stații');
      eq(assert, res.statii[0].bT, 250, 'b_T stația 1');
    });

    // Art. 15 alin. 3: întărirea postului — compensație doar pentru capacitatea suplimentară
    // a transformatorului existent (S_n 400, I_T 100.000 → b_T 250; primul utilizator 260 kVA → 140 kVA liberi).
    test('Art. 15 alin. 3 — întărire post: compensație limitată la capacitatea suplimentară', function (assert) {
      var res = E.computeStation({ Sn: 400, IT: 100000, intarire: true, primId: 'A',
        utilizatori: ['A', 'N'], nouUtilizatori: ['N'], puteri: { A: 260, N: 200 } });
      eq(assert, res.suplimentara.initiala, 140, 'capacitate suplimentară');
      eq(assert, res.payments['N']['A'], 140 * 250, 'N -> A (140 kVA × 250)');
      // fără întărire: tot 200 kVA × 250
      var normal = E.computeStation({ Sn: 400, IT: 100000, primId: 'A',
        utilizatori: ['A', 'N'], nouUtilizatori: ['N'], puteri: { A: 260, N: 200 } });
      eq(assert, normal.payments['N']['A'], 50000, 'fără întărire');
    });

    test('Art. 15 alin. 3 — doi utilizatori noi consumă succesiv capacitatea suplimentară', function (assert) {
      var res = E.computeStation({ Sn: 400, IT: 100000, intarire: true, primId: 'A',
        utilizatori: ['A', 'N1', 'N2'], nouUtilizatori: ['N1', 'N2'], puteri: { A: 260, N1: 100, N2: 100 } });
      eq(assert, res.payments['N1']['A'], 100 * 250, 'N1');
      eq(assert, res.payments['N2']['A'], 40 * 250, 'N2 (doar 40 kVA rămași)');
      eq(assert, res.suplimentara.ramasa, 0, 'rămas');
    });

    test('Art. 15 alin. 3 — capacitate suplimentară 0: nicio compensație', function (assert) {
      var res = E.computeStation({ Sn: 400, IT: 100000, intarire: true, primId: 'A',
        utilizatori: ['A', 'N'], nouUtilizatori: ['N'], puteri: { A: 400, N: 100 } });
      if (res.payments['N']) assert('nu ar trebui plată: ' + JSON.stringify(res.payments));
    });

    // Art. 15 alin. 1: al doilea circuit pe stâlpii liniei existente — costul stâlpilor în cote egale.
    test('Art. 15 alin. 1 — al doilea circuit pe stâlpi existenți (cote egale)', function (assert) {
      var res = E.computeLine({ nouUtilizatori: ['N'],
        tronsoane: [{ id: 'S', tip: 'stalpi', cost: 10000, utilizatori: ['U1', 'N'] }] });
      eq(assert, res.payments['N']['U1'], 5000, 'N -> U1');
      if (res.tronsoaneDetalii[0].tip !== 'stalpi') assert('tipul elementului nu s-a păstrat în detaliu');
    });

    test('Art. 15 alin. 1 — stâlpii folosiți de doi utilizatori existenți', function (assert) {
      var res = E.computeLine({ nouUtilizatori: ['N'],
        tronsoane: [{ id: 'S', tip: 'stalpi', cost: 12000, utilizatori: ['U1', 'U2', 'N'] }] });
      eq(assert, res.payments['N']['U1'], 2000, 'N -> U1');   // 6000 − 4000
      eq(assert, res.payments['N']['U2'], 2000, 'N -> U2');
    });

    var sum = document.createElement('div');
    sum.className = 'summary ' + (fail === 0 ? 'pass' : 'fail');
    sum.textContent = 'Rezultat: ' + pass + ' trecute, ' + fail + ' eșuate.';
    document.body.insertBefore(sum, out);
  </script>
</body>
</html>
